<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:2300px;height:1600px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%,#2b3440 0%,#151a21 60%,#0b0e12 100%);
    font-family:"Helvetica Neue",Arial,sans-serif;}
  .stage{position:absolute;left:0;top:0;width:2300px;height:1600px;perspective:3200px;}
  .floor{position:absolute;left:520px;top:1080px;width:1300px;height:260px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.65) 0%,rgba(0,0,0,0) 70%);filter:blur(18px);}
  .board3d{position:absolute;left:400px;top:300px;width:1500px;height:1125px;
    transform-style:preserve-3d;transform:rotateX(42deg) rotateZ(-16deg) translateY(-40px);}
  .edge{position:absolute;inset:0;border-radius:60px;background:#b9a27a;}
  .top{position:absolute;inset:0;transform:translateZ(0px);}
  .top svg{width:1500px;height:1125px;display:block;}
  .hdr{position:absolute;left:90px;top:80px;color:#e8edf2;}
  .hdr h1{margin:0;font-size:64px;font-weight:700;letter-spacing:.5px;}
  .hdr p{margin:10px 0 0;font-size:30px;color:#9fb0c0;}
  .tag{position:absolute;right:90px;bottom:70px;color:#7f8fa0;font-size:24px;text-align:right;line-height:1.5}
</style></head>
<body>
<div class="stage">
  <div class="floor"></div>
  <div class="board3d" id="b">
    <!-- FR-4 edge layers -->
    <div class="edge" style="transform:translateZ(-2px)"></div>
    <div class="edge" style="transform:translateZ(-5px)"></div>
    <div class="edge" style="transform:translateZ(-8px)"></div>
    <div class="edge" style="transform:translateZ(-11px)"></div>
    <div class="edge" style="transform:translateZ(-14px);background:#8f7b58"></div>
    <div class="edge" style="transform:translateZ(-17px);background:#7a6848"></div>
    <div class="top">
<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17603a"/><stop offset="1" stop-color="#0d4429"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f3f5"/><stop offset=".5" stop-color="#b8c0c8"/><stop offset="1" stop-color="#8d969f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7dc8a"/><stop offset="1" stop-color="#c79a35"/>
    </linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d31"/><stop offset="1" stop-color="#131416"/>
    </linearGradient>
    <linearGradient id="xiao" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2b4a"/><stop offset="1" stop-color="#0f1830"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="shs" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.2" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e9f2ec" stroke-width="1.2" opacity=".55"/>
    </pattern>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".5" fill="#fff" opacity=".035"/>
    </pattern>
  </defs>

  <!-- board -->
  <rect x="0" y="0" width="600" height="450" rx="24" fill="url(#mask)"/>
  <rect x="0" y="0" width="600" height="450" rx="24" fill="url(#grain)"/>
  <!-- peninsula slot for BME280 -->
  <path d="M300,452 V372 H388 V410" fill="none" stroke="#141a21" stroke-width="9" stroke-linecap="round"/>

  <!-- copper traces under mask -->
  <g fill="none" stroke="#2c8a55" stroke-width="3.2" stroke-linejoin="round" opacity=".85">
    <path d="M120,160 V150 H460 V140"/>
    <path d="M150,160 V154 H480 V140"/>
    <path d="M180,160 V158 H500 V140"/>
    <path d="M210,160 V162 H520 V140"/>
    <path d="M150,335 V350 H315 V212"/>
    <path d="M170,335 V346 H485 V246"/>
    <path d="M200,335 V342 H538 V346"/>
    <path d="M67,70 V82"/><path d="M180,70 V82"/>
    <path d="M300,110 H320"/><path d="M420,110 H440 V100"/>
    <path d="M556,60 H575"/>
  </g>
  <g fill="none" stroke="#2c8a55" stroke-width="7" opacity=".8">
    <path d="M95,102 H105"/><path d="M160,102 H190"/><path d="M225,102 H240"/><path d="M350,105 H360"/>
  </g>

  <!-- vias -->
  <g fill="url(#gold)">
    <circle cx="262" cy="150" r="3"/><circle cx="430" cy="154" r="3"/><circle cx="315" cy="300" r="3"/>
    <circle cx="420" cy="342" r="3"/><circle cx="260" cy="346" r="3"/><circle cx="120" cy="140" r="3"/>
    <circle cx="590" cy="240" r="3"/><circle cx="410" cy="200" r="3"/><circle cx="380" cy="300" r="3"/>
  </g>

  <!-- mounting holes -->
  <g>
    <circle cx="30" cy="30" r="14" fill="url(#gold)"/><circle cx="30" cy="30" r="9" fill="#141a21"/>
    <circle cx="570" cy="30" r="14" fill="url(#gold)"/><circle cx="570" cy="30" r="9" fill="#141a21"/>
    <circle cx="30" cy="420" r="14" fill="url(#gold)"/><circle cx="30" cy="420" r="9" fill="#141a21"/>
    <circle cx="570" cy="420" r="14" fill="url(#gold)"/><circle cx="570" cy="420" r="9" fill="#141a21"/>
  </g>

  <!-- connectors -->
  <g filter="url(#sh)">
    <rect x="45" y="14" width="66" height="46" rx="4" fill="#f3efe4"/>
    <rect x="135" y="14" width="66" height="46" rx="4" fill="#f3efe4"/>
    <rect x="232" y="18" width="46" height="40" rx="4" fill="#f3efe4"/>
  </g>
  <g fill="#c9c1ad"><rect x="55" y="22" width="46" height="18" rx="2"/><rect x="145" y="22" width="46" height="18" rx="2"/><rect x="240" y="25" width="30" height="16" rx="2"/></g>
  <g fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle" font-family="Arial">
    <text x="78" y="76">SOLAR 6V</text><text x="168" y="76">LiFePO4</text><text x="255" y="74">NTC</text>
  </g>

  <!-- power stage -->
  <g filter="url(#sh)">
    <rect x="40" y="88" width="55" height="30" rx="2" fill="url(#ic)"/>
    <rect x="105" y="88" width="55" height="30" rx="2" fill="url(#ic)"/>
    <rect x="190" y="86" width="35" height="35" rx="2" fill="url(#ic)"/>
    <rect x="240" y="80" width="60" height="60" rx="6" fill="#3a3d42"/>
    <rect x="320" y="90" width="30" height="30" rx="2" fill="url(#ic)"/>
    <rect x="360" y="80" width="60" height="60" rx="6" fill="#3a3d42"/>
  </g>
  <rect x="42" y="88" width="7" height="30" fill="#d8d8d8" opacity=".75"/>
  <rect x="107" y="88" width="7" height="30" fill="#d8d8d8" opacity=".75"/>
  <circle cx="270" cy="110" r="20" fill="#2a2c30"/><circle cx="390" cy="110" r="20" fill="#2a2c30"/>
  <g fill="#bfc6cc" font-size="7.5" font-family="Arial" text-anchor="middle">
    <text x="67" y="107">SMBJ6.5A</text><text x="132" y="107">SS34</text>
    <text x="207" y="106">BQ25570</text><text x="270" y="113">4R7</text>
    <text x="335" y="108">TPS</text><text x="335" y="116">63900</text><text x="390" y="113">2R2</text>
  </g>
  <!-- passives -->
  <g filter="url(#shs)">
    <rect x="200" y="128" width="10" height="6" fill="#c9a26a"/><rect x="215" y="128" width="10" height="6" fill="#c9a26a"/>
    <rect x="322" y="128" width="10" height="6" fill="#c9a26a"/><rect x="338" y="128" width="10" height="6" fill="#c9a26a"/>
    <rect x="300" y="250" width="10" height="6" fill="#c9a26a"/><rect x="316" y="250" width="10" height="6" fill="#c9a26a"/>
    <rect x="455" y="260" width="10" height="6" fill="#c9a26a"/><rect x="505" y="300" width="6" height="10" fill="#c9a26a"/>
    <rect x="560" y="95" width="6" height="10" fill="#c9a26a"/><rect x="250" y="365" width="10" height="6" fill="#2b2b2b"/>
    <rect x="410" y="250" width="10" height="6" fill="#2b2b2b"/><rect x="530" y="210" width="10" height="6" fill="#2b2b2b"/>
  </g>

  <!-- Wio-SX1262 SMT module -->
  <g filter="url(#sh)">
    <rect x="440" y="30" width="116" height="110" rx="4" fill="#1b1d22"/>
    <rect x="446" y="36" width="104" height="98" rx="3" fill="url(#silver)"/>
  </g>
  <g fill="url(#gold)">
    <rect x="436" y="44" width="6" height="8"/><rect x="436" y="64" width="6" height="8"/><rect x="436" y="84" width="6" height="8"/><rect x="436" y="104" width="6" height="8"/><rect x="436" y="124" width="6" height="8"/>
    <rect x="554" y="44" width="6" height="8"/><rect x="554" y="64" width="6" height="8"/><rect x="554" y="84" width="6" height="8"/><rect x="554" y="104" width="6" height="8"/><rect x="554" y="124" width="6" height="8"/>
  </g>
  <g font-family="Arial" text-anchor="middle" fill="#4b545d">
    <text x="498" y="78" font-size="13" font-weight="700">Wio-SX1262</text>
    <text x="498" y="95" font-size="8.5">LoRa 862-930 MHz</text>
    <text x="498" y="108" font-size="8.5">+22 dBm</text>
  </g>
  <g filter="url(#sh)"><circle cx="580" cy="60" r="9" fill="url(#gold)"/></g>
  <circle cx="580" cy="60" r="3.5" fill="#7a5d1f"/>
  <text x="580" y="84" fill="#fff" font-size="8" font-family="Arial" text-anchor="middle" font-weight="700">ANT</text>

  <!-- XIAO nRF52840 -->
  <g filter="url(#sh)">
    <rect x="20" y="160" width="210" height="175" rx="8" fill="url(#xiao)"/>
  </g>
  <g fill="url(#gold)">
    <circle cx="45" cy="160" r="5"/><circle cx="75" cy="160" r="5"/><circle cx="105" cy="160" r="5"/><circle cx="135" cy="160" r="5"/><circle cx="165" cy="160" r="5"/><circle cx="195" cy="160" r="5"/><circle cx="215" cy="160" r="5"/>
    <circle cx="45" cy="335" r="5"/><circle cx="75" cy="335" r="5"/><circle cx="105" cy="335" r="5"/><circle cx="135" cy="335" r="5"/><circle cx="165" cy="335" r="5"/><circle cx="195" cy="335" r="5"/><circle cx="215" cy="335" r="5"/>
  </g>
  <g filter="url(#sh)">
    <rect x="6" y="222" width="44" height="52" rx="6" fill="url(#silver)"/>
    <rect x="80" y="192" width="100" height="110" rx="4" fill="url(#silver)"/>
    <rect x="195" y="230" width="22" height="34" rx="2" fill="#d8d2c4"/>
  </g>
  <rect x="14" y="238" width="10" height="20" rx="3" fill="#555c63"/>
  <g font-family="Arial" text-anchor="middle" fill="#4b545d">
    <text x="130" y="238" font-size="11" font-weight="700">nRF52840</text>
    <text x="130" y="254" font-size="8">BLE 5.0 · NFC</text>
    <text x="130" y="268" font-size="8">Cortex-M4F</text>
  </g>
  <text x="130" y="320" fill="#d9e2f0" font-size="10" font-family="Arial" text-anchor="middle" font-weight="700">XIAO nRF52840</text>

  <!-- RF keep-out -->
  <rect x="236" y="160" width="50" height="175" fill="url(#hatch)" stroke="#e9f2ec" stroke-width="1.2" stroke-dasharray="4 3" opacity=".9"/>
  <text x="261" y="252" fill="#fff" font-size="8.5" font-family="Arial" text-anchor="middle" font-weight="700" transform="rotate(-90 261 252)">BLE ANTENNA KEEP-OUT</text>

  <!-- PCA9536 + load switches -->
  <g filter="url(#shs)">
    <rect x="300" y="180" width="30" height="30" rx="2" fill="url(#ic)"/>
    <rect x="300" y="228" width="16" height="11" rx="1.5" fill="url(#ic)"/>
    <rect x="325" y="228" width="16" height="11" rx="1.5" fill="url(#ic)"/>
  </g>
  <g fill="#fff" font-size="7.5" font-family="Arial" font-weight="700">
    <text x="300" y="222">U4 PCA9536</text><text x="300" y="248">Q1 Q2 TPS22916</text>
  </g>

  <!-- IMU on standoff -->
  <circle cx="485" cy="232" r="34" fill="none" stroke="#ffd23f" stroke-width="2" stroke-dasharray="5 3"/>
  <g filter="url(#shs)"><rect x="470" y="220" width="30" height="24" rx="2" fill="url(#ic)"/></g>
  <circle cx="474" cy="224" r="1.6" fill="#888"/>
  <g fill="#ffd23f" font-size="8" font-family="Arial" font-weight="700" text-anchor="middle">
    <text x="485" y="186">LSM6DSOX · ML CORE</text><text x="485" y="281">TRUNK-COUPLED</text>
  </g>

  <!-- MEMS mic with acoustic port -->
  <circle cx="538" cy="333" r="26" fill="none" stroke="#5fd3ff" stroke-width="2"/>
  <circle cx="538" cy="333" r="31" fill="none" stroke="#5fd3ff" stroke-width="1" stroke-dasharray="3 3"/>
  <g filter="url(#shs)"><rect x="520" y="320" width="36" height="26" rx="3" fill="url(#silver)"/></g>
  <circle cx="538" cy="333" r="3" fill="#2a2f35"/>
  <text x="538" y="378" fill="#5fd3ff" font-size="8" font-family="Arial" font-weight="700" text-anchor="middle">PDM MIC · ePTFE PORT</text>

  <!-- BME280 on peninsula -->
  <g filter="url(#shs)"><rect x="330" y="398" width="25" height="25" rx="2" fill="url(#silver)"/></g>
  <circle cx="336" cy="404" r="1.8" fill="#333"/>
  <text x="343" y="440" fill="#fff" font-size="7.5" font-family="Arial" font-weight="700" text-anchor="middle">BME280</text>

  <!-- NFC pads + test points -->
  <g fill="url(#gold)">
    <rect x="218" y="392" width="22" height="14" rx="2"/><rect x="248" y="392" width="22" height="14" rx="2"/>
    <circle cx="62" cy="400" r="7"/><circle cx="100" cy="400" r="7"/><circle cx="138" cy="400" r="7"/><circle cx="176" cy="400" r="7"/>
  </g>
  <g fill="#fff" font-size="7.5" font-family="Arial" font-weight="700" text-anchor="middle">
    <text x="244" y="420">NFC1  NFC2</text>
    <text x="62" y="420">3V3</text><text x="100" y="420">GND</text><text x="138" y="420">VBAT</text><text x="176" y="420">VSOL</text>
  </g>

  <!-- multi-colour silkscreen power flow -->
  <g font-family="Arial" font-weight="700" font-size="10.5">
    <text x="40" y="372"><tspan fill="#ffb02e">SUN</tspan><tspan fill="#ffffff"> → </tspan><tspan fill="#ff6b6b">MPPT</tspan><tspan fill="#ffffff"> → </tspan><tspan fill="#7ee081">LiFePO4</tspan><tspan fill="#ffffff"> → </tspan><tspan fill="#5fd3ff">BUCK-BOOST</tspan><tspan fill="#ffffff"> → </tspan><tspan fill="#ffd23f">3V3</tspan></text>
  </g>

  <!-- QR code placeholder (silkscreen) -->
  <g transform="translate(408,386)">
    <rect width="54" height="54" fill="#f4f6f5"/>
    <g fill="#0d4429">
      <rect x="3" y="3" width="15" height="15"/><rect x="36" y="3" width="15" height="15"/><rect x="3" y="36" width="15" height="15"/>
      <rect x="6" y="6" width="9" height="9" fill="#f4f6f5"/><rect x="39" y="6" width="9" height="9" fill="#f4f6f5"/><rect x="6" y="39" width="9" height="9" fill="#f4f6f5"/>
      <rect x="8" y="8" width="5" height="5"/><rect x="41" y="8" width="5" height="5"/><rect x="8" y="41" width="5" height="5"/>
      <rect x="22" y="4" width="4" height="4"/><rect x="27" y="10" width="4" height="4"/><rect x="22" y="16" width="4" height="4"/>
      <rect x="22" y="24" width="4" height="4"/><rect x="30" y="24" width="4" height="4"/><rect x="38" y="24" width="4" height="4"/>
      <rect x="46" y="28" width="4" height="4"/><rect x="26" y="30" width="4" height="4"/><rect x="34" y="34" width="4" height="4"/>
      <rect x="42" y="40" width="4" height="4"/><rect x="24" y="40" width="4" height="4"/><rect x="30" y="46" width="4" height="4"/>
      <rect x="44" y="46" width="4" height="4"/><rect x="4" y="24" width="4" height="4"/><rect x="12" y="28" width="4" height="4"/>
    </g>
  </g>
  <text x="435" y="449" fill="#fff" font-size="6.5" font-family="Arial" text-anchor="middle" font-weight="700">OSHWLab</text>

  <!-- board title -->
  <text x="40" y="444" fill="#ffffff" font-size="15" font-family="Arial" font-weight="700">SylvaEcho v0.1</text>
  <text x="160" y="444" fill="#cfe6d7" font-size="8.5" font-family="Arial">4-LAYER · EasyEDA Pro · Spark 2026</text>
</svg>
    </div>
  </div>
  <div class="hdr">
    <h1>SylvaEcho carrier board</h1>
    <p>XIAO nRF52840 + Wio-SX1262 SMT · 4-layer FR-4 · multi-colour silkscreen</p>
  </div>
  <div class="tag">Concept render, pre-layout<br>Final EasyEDA Pro 3D export to follow</div>
</div>
</body></html>
