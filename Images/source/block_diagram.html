<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:2300px;height:1600px;background:#ffffff;font-family:"Helvetica Neue",Arial,sans-serif;}
</style></head><body>
<svg width="2300" height="1600" viewBox="0 0 2300 1600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
</defs>
<style>
 .t{font-size:40px;font-weight:700;fill:#0f172a}
 .h{font-size:29px;font-weight:700;fill:#0f172a}
 .s{font-size:23px;fill:#475569}
 .l{font-size:21px;fill:#334155;font-weight:600}
 .pw rect{fill:#fff7ed;stroke:#c2410c;stroke-width:3}
 .mc rect{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3}
 .sn rect{fill:#f0fdf4;stroke:#15803d;stroke-width:3}
 .rf rect{fill:#faf5ff;stroke:#7e22ce;stroke-width:3}
 .op rect{fill:#f8fafc;stroke:#64748b;stroke-width:3;stroke-dasharray:12 8}
</style>
<text x="80" y="85" class="t">SylvaEcho system architecture (rev 0.4)</text>
<text x="80" y="128" class="s">Power path (orange) · data buses (blue) · wake line (red) · AON = always on, SW = switched rail · dashed = optional add-on</text>

<!-- power chain -->
<g class="pw">
  <rect x="80" y="180" width="380" height="150" rx="16"/>
  <rect x="540" y="180" width="400" height="150" rx="16"/>
  <rect x="1020" y="180" width="400" height="150" rx="16"/>
  <rect x="1500" y="180" width="400" height="150" rx="16"/>
</g>
<text x="105" y="232" class="h">Solar panel</text><text x="105" y="270" class="s">0.3–0.5 W · Voc below 3.1 V</text><text x="105" y="305" class="s">Schottky D1 + 4.7 V zener D2</text>
<text x="565" y="232" class="h">BQ25570 harvester</text><text x="565" y="270" class="s">Harvests from 100 mV</text><text x="565" y="305" class="s">Charges the cell to 3.51 V</text>
<text x="1045" y="232" class="h">LiFePO4 IFR18500</text><text x="1045" y="270" class="s">1S · 1000 mAh</text><text x="1045" y="305" class="s">JST-PH cable to the board</text>
<text x="1525" y="232" class="h">TPS63900 buck-boost</text><text x="1525" y="270" class="s">3.3 V · ~75 nA idle</text><text x="1525" y="305" class="s">EN driven by VBAT_OK</text>
<g stroke="#c2410c" stroke-width="5" fill="none">
  <path d="M460,255 H532" marker-end="url(#ar)"/><path d="M940,255 H1012" marker-end="url(#ar)"/><path d="M1420,255 H1492" marker-end="url(#ar)"/>
  <path d="M1900,255 H2030 V392" marker-end="url(#ar)"/>
  <path d="M740,330 V365 H1700 V338" marker-end="url(#ar)" stroke-dasharray="10 7"/>
</g>
<text x="1945" y="300" class="l" fill="#c2410c">3V3_AON</text>
<text x="800" y="395" class="l" fill="#c2410c">VBAT_OK (off at 2.79 V, on at 3.05 V) enables the 3.3 V rail</text>

<!-- MCU -->
<g class="mc"><rect x="760" y="560" width="620" height="330" rx="20"/></g>
<text x="790" y="618" class="h">Seeed XIAO nRF52840</text>
<text x="790" y="660" class="s">Cortex-M4F 64 MHz · 256 KB RAM · 1 MB flash</text>
<text x="790" y="698" class="s">Zephyr / nRF Connect SDK</text>
<text x="790" y="736" class="s">Buzz + bird scores, chainsaw check</text>
<text x="790" y="774" class="s">HMAC-signed LoRa reports</text>
<text x="790" y="812" class="s">BLE 5.0 setup · NFC tap to wake</text>
<text x="790" y="862" class="l">AON · sleeps until timer or WAKE_N</text>

<!-- LoRa -->
<g class="rf"><rect x="1600" y="400" width="600" height="210" rx="20"/></g>
<text x="1630" y="455" class="h">Wio-SX1262 SMT module</text>
<text x="1630" y="495" class="s">862–930 MHz · IN865 default · +22 dBm</text>
<text x="1630" y="533" class="s">TCXO on DIO3 · RF_SW from expander</text>
<text x="1630" y="571" class="s">U.FL → pigtail → SMA antenna</text>
<path d="M1380,620 H1500 V505 H1592" stroke="#1d4ed8" stroke-width="5" fill="none" marker-end="url(#ab)"/>
<text x="1395" y="600" class="l">SPI · NSS · BUSY · DIO1</text>

<!-- NFC -->
<g class="rf"><rect x="1600" y="680" width="600" height="170" rx="20"/></g>
<text x="1630" y="735" class="h">NFC coil (13.56 MHz)</text>
<text x="1630" y="775" class="s">Under the lid · NFC1 / NFC2</text>
<text x="1630" y="813" class="s">Phone tap wakes BLE for setup</text>
<path d="M1592,765 H1388" stroke="#1d4ed8" stroke-width="5" fill="none" marker-end="url(#ab)"/>

<!-- Qwiic / SC-1 -->
<g class="op"><rect x="1600" y="920" width="600" height="260" rx="20"/></g>
<text x="1630" y="975" class="h">Qwiic → SC-1 add-on (optional)</text>
<text x="1630" y="1015" class="s">USBLC6 ESD on the Qwiic port</text>
<text x="1630" y="1053" class="s">ATtiny1616 0x2A · INA219 battery gauge</text>
<text x="1630" y="1091" class="s">ATECC608B 0x60 secure element</text>
<text x="1630" y="1129" class="s">Soil moisture, rain gauge, NTCs, borer mic</text>
<text x="1630" y="1163" class="l">Alerts pulse WAKE_N</text>

<!-- Piezo wake (AON) -->
<g class="sn"><rect x="80" y="400" width="580" height="210" rx="20"/></g>
<text x="110" y="455" class="h">Trunk-vibration wake</text>
<text x="110" y="495" class="s">Piezo disc on the trunk plate</text>
<text x="110" y="533" class="s">50–340 Hz band-pass · BAT54 clamps</text>
<text x="110" y="571" class="s">TLV7041 nanopower comparator</text>
<text x="110" y="600" class="l">AON · open-drain → WAKE_N</text>

<!-- IMU -->
<g class="sn"><rect x="80" y="660" width="580" height="190" rx="20"/></g>
<text x="110" y="715" class="h">LSM6DSOX IMU</text>
<text x="110" y="755" class="s">Slow tilt · high-rate burst for chainsaw check</text>
<text x="110" y="793" class="s">Over the mounting hole to the trunk plate</text>
<text x="110" y="830" class="l">AON · INT1 → WAKE_N · I2C 0x6A</text>

<!-- WAKE_N line -->
<g stroke="#b91c1c" stroke-width="5" fill="none">
  <path d="M660,505 H700 V600 H752" marker-end="url(#ag)"/>
  <path d="M660,720 H700 V600"/>
  <path d="M1600,1150 H1520 V860 H1388" marker-end="url(#ag)" stroke-dasharray="10 7"/>
</g>
<text transform="translate(688,700) rotate(-90)" class="l" fill="#b91c1c">WAKE_N</text>

<!-- Mic -->
<g class="sn"><rect x="80" y="900" width="580" height="190" rx="20"/></g>
<text x="110" y="955" class="h">PDM MEMS microphone</text>
<text x="110" y="995" class="s">Bottom port over a PCB hole · ePTFE vent</text>
<text x="110" y="1033" class="s">TPS22917 load switch (EN_MIC)</text>
<text x="110" y="1070" class="l">SW rail 3V3_MIC</text>
<path d="M660,920 H740 V850 H752" stroke="#1d4ed8" stroke-width="5" fill="none" marker-end="url(#ab)"/>
<text x="600" y="895" class="l">PDM</text>

<!-- Env sensor -->
<g class="sn"><rect x="80" y="1140" width="580" height="170" rx="20"/></g>
<text x="110" y="1195" class="h">BME680</text>
<text x="110" y="1235" class="s">Temperature · humidity · pressure</text>
<text x="110" y="1273" class="s">Slotted PCB tab, away from regulators · I2C 0x76</text>

<!-- Expander -->
<g class="mc"><rect x="760" y="980" width="620" height="200" rx="20"/></g>
<text x="790" y="1037" class="h">TCA9534 I2C expander (0x20)</text>
<text x="790" y="1079" class="s">LoRa reset · RF_SW · EN_MIC · status LED</text>
<text x="790" y="1117" class="s">Frees XIAO pins: all 11 GPIOs are used</text>

<!-- I2C bus -->
<g stroke="#1d4ed8" stroke-width="5" fill="none">
  <path d="M1070,898 V972" marker-end="url(#ab)"/>
  <path d="M1070,950 H1460 V1050 H1592" marker-end="url(#ab)"/>
  <path d="M1070,950 H700 V1225 H668" marker-end="url(#ab)"/>
  <path d="M700,780 H668" marker-end="url(#ab)"/>
  <path d="M700,950 V780"/>
</g>
<text x="1090" y="938" class="l">I2C</text>

<!-- Logic -->
<rect x="80" y="1350" width="2120" height="210" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
<text x="110" y="1400" class="h">Dual-trigger logic</text>
<text x="110" y="1442" class="s">1. Every 30 min: wake 10 s → mic on → Pollinator Buzz Index (150–400 Hz) + bird activity (1–6 kHz) → signed LoRa report.</text>
<text x="110" y="1480" class="s">2. Always on: the piezo comparator pulls WAKE_N on sustained trunk vibration → MCU wakes → IMU burst + three 1 s audio checks.</text>
<text x="110" y="1518" class="s">3. A priority alert is sent only when vibration and sound agree. Slow tilt (tree fall, soil creep) is reported separately.</text>
<text x="110" y="1550" class="l">Estimated average current ~115 µA · ~360 days on the 1000 mAh cell without sun (to be measured with a PPK2)</text>
</svg>
</body></html>
