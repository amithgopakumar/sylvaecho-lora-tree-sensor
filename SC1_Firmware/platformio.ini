; SylvaEcho SC-1 companion board: ATtiny1616 co-processor (I2C slave 0x2A)
;
; Build:   pio run
; Flash:   pio run -t upload --upload-port /dev/cu.usbserial-XXXX
;          (SerialUPDI: any 3.3 V USB-serial adapter, 4.7k from TX to RX, RX to J9 pin 1 UPDI)
;
; Runs at 10 MHz from the internal oscillator: safe on the 3.3 V rail.

[env:sc1]
platform = atmelmegaavr
board = ATtiny1616
framework = arduino
board_build.f_cpu = 10000000L
board_hardware.oscillator = internal
board_hardware.bod = disabled
board_hardware.eesave = yes

upload_protocol = serialupdi
upload_speed = 230400

build_flags = -Wall -Wextra
