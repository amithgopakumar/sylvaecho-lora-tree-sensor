; SylvaEcho gateway: Seeed XIAO ESP32S3 + Wio-SX1262 (kit 102010611)
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor   (one JSON line per received packet)
;
; Copy src/secrets.example.h to src/secrets.h and fill in Wi-Fi / MQTT first.

[env:gateway]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
lib_deps =
    jgromes/RadioLib@^7.1.2
    knolleary/PubSubClient@^2.8
