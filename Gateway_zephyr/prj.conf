# SylvaEcho gateway (Zephyr) for the XIAO ESP32S3 + Wio-SX1262

# C++ for the decoder shared with the Arduino gateway (../Gateway/src/decode.cpp)
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Radio
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_LORA=y

# Wi-Fi, IPv4, DHCP, DNS, sockets
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_CONNECTION_MANAGER=n

# MQTT
CONFIG_MQTT_LIB=y
CONFIG_MQTT_KEEPALIVE=60

# Console and logs on the USB serial port
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
