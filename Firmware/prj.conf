# Core
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_FPU=y

# Buses and devices
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_LORA=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Random boot epoch for report authentication
CONFIG_ENTROPY_GENERATOR=y

# Power
CONFIG_PM_DEVICE=y

# Logging over RTT (UART0 pins D6/D7 are used by the PDM microphone)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_CBPRINTF_FP_SUPPORT=y
